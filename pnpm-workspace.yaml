packages:
  - 'apps/*'
  - 'packages/*'

# esbuild backs tsx/tsup and must run its postinstall to fetch a native binary.
# Prisma's postinstall downloads its query and schema engines.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
