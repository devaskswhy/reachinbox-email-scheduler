services:
  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: unless-stopped
    # AOF persistence: delayed/queued BullMQ jobs must survive a container restart.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8
    container_name: reachinbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: reachinbox
      MYSQL_DATABASE: reachinbox
      MYSQL_USER: reachinbox
      MYSQL_PASSWORD: reachinbox
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-preachinbox']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  redis-data:
  mysql-data:
